            margin-bottom: 20px;
            z-index: 2;
        }

        .ticker-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border-radius: 16px;
            padding: 10px 8px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .ticker-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, #00f2fe, #00e676);
        }

        .ticker-card .name {

            gap: 3px;
            color: #00e676;
            text-shadow: 0 0 10px rgba(0, 230, 118, 0.3);
        }

        .ticker-card .val i {
            font-size: 11px;

        }

        }

            color: #94a3b8;
        }
